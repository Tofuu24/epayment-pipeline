# MongoDB -> Kafka Connect -> Kafka -> (Spark, runs outside Compose) -> Cassandra
#
#   docker compose up -d --build
#
# Host ports:
#   9092   Kafka           (Spark connects here)
#   9042   Cassandra CQL   (Spark connects here)
#   27018  MongoDB         (for mongosh / Compass only; 27018 so it never clashes
#                           with a native MongoDB service already on 27017)

services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: initiates the replica set and seeds the 5 institutions, then exits.
  mongo-init:
    image: mongo:8.0
    container_name: mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./mongo-init:/mongo-init:ro
    command: ["mongosh", "--quiet", "--host", "mongodb:27017", "/mongo-init/seed.js"]
    restart: "no"

  kafka:
    image: apache/kafka:4.2.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is for other containers (kafka:19092), EXTERNAL is for the host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 15s

  # One-shot: pre-creates the topics Spark subscribes to, so Spark never starts
  # against a topic that doesn't exist yet.
  kafka-init:
    image: apache/kafka:4.2.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in institution-registry-events payment-intent-events rail-routing-events settlement-events webhook-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1
        done
    restart: "no"

  # Standalone-mode Kafka Connect: offsets live in a local file, so there are no
  # internal topics and no replication-factor problem, and the connector starts
  # automatically (no REST registration step).
  kafka-connect:
    build:
      context: .
      dockerfile: Dockerfile.connect
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./connect-config:/opt/connect-config:ro
      - connect-offsets:/var/lib/connect
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      # Keep memory use laptop-friendly; the default sizes to 1/4 of RAM.
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # One-shot: creates the payment_pipeline keyspace and tables, then exits.
  cassandra-init:
    image: cassandra:5.0
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra-init:/cassandra-init:ro
    command: ["cqlsh", "cassandra", "9042", "-f", "/cassandra-init/schema.cql"]
    restart: "no"

volumes:
  mongo-data:
  kafka-data:
  connect-offsets:
  cassandra-data:
