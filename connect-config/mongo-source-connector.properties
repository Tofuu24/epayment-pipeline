name=mongo-institution-source
connector.class=com.mongodb.kafka.connect.MongoSourceConnector
tasks.max=1

connection.uri=mongodb://mongodb:27017/?replicaSet=rs0
database=payment_metadata
collection=institution_registry

# Topic is exactly "institution-registry-events" (topic.prefix would prepend to
# <db>.<collection> instead of replacing it).
topic.namespace.map={"payment_metadata.institution_registry": "institution-registry-events"}

# Snapshot the documents that already exist before streaming live changes,
# otherwise the 5 seeded institutions never reach Kafka.
startup.mode=copy_existing

# Publish just the document itself, e.g.
#   {"_id":"...","institution_code":"BANK_BPI","institution_name":"BPI",...}
# instead of the full change-stream envelope ({"operationType":...,"fullDocument":{...}}).
# This is the shape Spark Job A's schema expects. Updates carry the full current
# document; deletes produce no message (deactivate with active:false instead).
publish.full.document.only=true
output.format.value=json
output.json.formatter=com.mongodb.kafka.connect.source.json.formatter.SimplifiedJson
