bootstrap.servers=kafka:19092

# The Mongo connector already emits JSON strings (see mongo-source-connector.properties),
# so pass them through untouched. JsonConverter would wrap every message in a
# {"schema":...,"payload":...} envelope that Spark's from_json can't parse.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter

# Standalone mode keeps source offsets (the change-stream resume token) in this file.
# It's on a named volume, so restarts resume where they left off.
offset.storage.file.filename=/var/lib/connect/connect.offsets
offset.flush.interval.ms=10000

plugin.path=/opt/connect-plugins

# REST API (status only, e.g. curl localhost:8083/connectors/mongo-institution-source/status
# from inside the container). Not published to the host.
listeners=http://0.0.0.0:8083
